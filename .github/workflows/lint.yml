name: Lint

on:
  push: {}
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install linters
        run: |
          npm install --no-save eslint @eslint/js globals stylelint stylelint-config-standard htmlhint

      - name: HTML hint
        run: npx htmlhint "**/*.html" --config .htmlhintrc

      - name: Stylelint
        run: npx stylelint "css/**/*.css"

      - name: ESLint (js/code.js only)
        run: npx eslint js/code.js
