name: Lint and Test

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint HTML
        run: npx htmlhint index.html color.html

      - name: Lint CSS
        run: npx stylelint css/styles.css

      - name: Lint JS
        run: npx eslint js/code.js js/colorUtils.js

      - name: Run tests
        run: npm test